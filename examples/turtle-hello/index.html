<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Turtle Hello - PyodideTk</title>
    <link rel="stylesheet" href="/examples/_shared/style.css" />
  </head>
  <body>
    <h1>Turtle Hello</h1>
    <p>Stdlib <code>turtle</code> drawing on a Tk Canvas, in the browser.</p>
    <canvas id="canvas" width="1024" height="768"></canvas>
    <div id="log">booting…</div>

    <!-- Standard Python turtle, unchanged. -->
    <script type="text/python" id="demo">
import turtle

screen = turtle.Screen()
screen.title("hello pyodide-tk · turtle")

t = turtle.Turtle()
t.shape("turtle")
t.pensize(3)
t.color("steelblue")
t.speed(3)

for i in range(4):
    t.forward(150)
    t.left(90)

t.penup()
t.goto(0, -120)
t.color("crimson")
t.write("hello, pyodide-tk!", align="center", font=("Arial", 16, "bold"))
t.hideturtle()

turtle.done()
    </script>

    <script type="module" src="/examples/_shared/boot.ts"></script>
  </body>
</html>
