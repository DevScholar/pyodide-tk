<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>pyodide-tk · tk-hello</title>
    <!-- Warm the HTTP cache for the assets the worker fetches first.
         See ../../README.md for why these preloads matter. -->
    <link rel="preload" as="fetch" type="application/wasm" crossorigin
          href="/pyodide/pyodide.asm.wasm" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide/python_stdlib.zip" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/tcl-library.tar" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/tk-library.tar" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/tkinter.tar" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/lib/libtcl8.6.so" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/lib/libtk8.6.so" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/lib/libemx11.so" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/lib/_tkinter.so" />
    <style>
      html, body { margin: 0; min-height: 100%; font-family: system-ui, sans-serif; }
      body { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
      #log {
        font-family: ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
        background: #111; color: #ddd;
        padding: 0.75rem 1rem; border-radius: 6px;
        max-height: 12rem; overflow: auto;
      }
      #emx11-canvas {
        border: 1px solid #888; background: #fff;
        width: 1024px; height: 768px;
        flex: none; align-self: flex-start;
      }
    </style>
  </head>
  <body>
    <h1>pyodide-tk · tk-hello</h1>
    <p>Real Pyodide + real CPython 3.14 + real Tk widgets, all in the browser.</p>
    <canvas id="emx11-canvas" width="1024" height="768"></canvas>
    <div id="log">booting…</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
