<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>pyodide-tk · tk-hello</title>
    <!-- Warm the HTTP cache for the assets the worker fetches first. -->
    <link rel="preload" as="fetch" type="application/wasm" crossorigin
          href="/pyodide/pyodide.asm.wasm" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide/python_stdlib.zip" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/tcl-library.tar" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/tk-library.tar" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/tkinter.tar" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/lib/libtcl8.6.so" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/lib/libtk8.6.so" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/lib/libemx11.so" />
    <link rel="preload" as="fetch" crossorigin
          href="/pyodide-tk-assets/lib/_tkinter.so" />
    <style>
      html, body { margin: 0; min-height: 100%; font-family: system-ui, sans-serif; }
      body { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
      #log {
        font-family: ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
        background: #111; color: #ddd;
        padding: 0.75rem 1rem; border-radius: 6px;
        max-height: 12rem; overflow: auto;
      }
      #emx11-canvas {
        border: 1px solid #888; background: #fff;
        width: 1024px; height: 768px;
        flex: none; align-self: flex-start;
      }
    </style>
  </head>
  <body>
    <h1>pyodide-tk · tk-hello</h1>
    <p>Real Pyodide + real CPython 3.14 + real Tk widgets, all in the browser.</p>
    <canvas id="emx11-canvas" width="1024" height="768"></canvas>
    <div id="log">booting…</div>

    <!-- The Python you'd run on a desktop, unchanged. -->
    <script type="text/python" id="demo">
import tkinter as tk

root = tk.Tk()
root.title("hello pyodide-tk")

tk.Label(root, text="Tk on WebAssembly",
         font=("Helvetica", 14, "bold"), pady=6).pack(fill="x")
tk.Frame(root, height=2, relief="sunken", bd=1).pack(fill="x", padx=8, pady=2)

# Row 1: multi-line text entry + Greet button -> output label
row1 = tk.Frame(root)
tk.Label(row1, text="Names:", width=8, anchor="ne").pack(side="left", padx=4, pady=6)
entry = tk.Text(row1, width=24, height=4)
entry.insert("end", "One\nTwo\nThree")
entry.pack(side="left", padx=4, pady=6)

def greet():
    raw = entry.get("1.0", "end").strip()
    if not raw:
        out.config(text="Hello, World!")
    else:
        names = [s.strip() for s in raw.split("\n") if s.strip()]
        out.config(text="Hello, " + ", ".join(names) + "!")

tk.Button(row1, text="Greet", command=greet).pack(side="left", padx=4, pady=6)
row1.pack()

# Row 2: click counter
clicks = tk.IntVar(value=0)
row2 = tk.Frame(root)
tk.Label(row2, text="Clicks:", width=8, anchor="e").pack(side="left", padx=4, pady=6)
tk.Label(row2, textvariable=clicks, width=4, relief="sunken", anchor="e").pack(side="left", padx=4, pady=6)
tk.Button(row2, text=" + ", command=lambda: clicks.set(clicks.get() + 1)).pack(side="left", padx=4, pady=6)
tk.Button(row2, text=" - ",
          command=lambda: clicks.set(max(0, clicks.get() - 1))).pack(side="left", padx=4, pady=6)
tk.Button(row2, text="Reset", command=lambda: clicks.set(0)).pack(side="left", padx=4, pady=6)
row2.pack()

out = tk.Label(root, text="(press Greet)", relief="groove", bd=2,
               padx=8, pady=4, width=32, wraplength=240, justify="left")
out.pack(padx=12, pady=8)

root.mainloop()
    </script>

    <!-- Hand the inline Python to the shared worker harness. -->
    <script type="module">
      import { runDemo } from '/src/demo-harness.ts';
      runDemo({ pythonCode: document.getElementById('demo').textContent });
    </script>
  </body>
</html>
